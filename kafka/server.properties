# GetReplay production Kafka: one broker and one KRaft controller on the same host.
# This listener is intentionally loopback-only because every current producer and
# consumer runs on the production host. Add TLS/SASL before allowing remote clients.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@127.0.0.1:9093
controller.listener.names=CONTROLLER

listeners=PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
advertised.listeners=PLAINTEXT://127.0.0.1:9092
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
inter.broker.listener.name=PLAINTEXT

log.dirs=/var/lib/kafka
num.partitions=6
default.replication.factor=1
min.insync.replicas=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
unclean.leader.election.enable=false
auto.create.topics.enable=false

# Keep work available through a week-long application outage. Kafka is not the
# archive for replay payloads; messages should contain durable object/file references.
log.retention.hours=168
log.retention.check.interval.ms=300000
log.segment.bytes=1073741824

group.initial.rebalance.delay.ms=0
