name: Deploy production
run-name: Deploy full reviewed candidate by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: getreplay-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy all components
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
    env:
      RELEASE_HOST: ${{ vars.PRODUCTION_RELEASE_HOST }}
      RELEASE_PORT: ${{ vars.PRODUCTION_RELEASE_PORT }}
      RELEASE_USER: ${{ vars.PRODUCTION_RELEASE_USER }}
      RELEASE_SCOPE: all
      RELEASE_KEY: ${{ secrets.PRODUCTION_RELEASE_SSH_KEY }}
      RELEASE_KNOWN_HOSTS: ${{ secrets.PRODUCTION_RELEASE_KNOWN_HOSTS }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Run reviewed production deployment
        shell: bash
        run: |
          set -euo pipefail
          runner="$RUNNER_TEMP/run-production-scope.sh"
          api_url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/release/run-production-scope.sh?ref=$GITHUB_SHA"
          response="$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$api_url")"
          encoded="$(jq -r '.content // empty' <<<"$response" | tr -d '\n')"
          [[ "$encoded" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
          printf '%s' "$encoded" | base64 --decode > "$runner"
          bash "$runner"
