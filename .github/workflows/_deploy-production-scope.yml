name: Promote production scope

on:
  workflow_call:
    inputs:
      release-scope:
        description: Fixed component scope selected by a reviewed caller workflow
        required: true
        type: string

permissions: {}

concurrency:
  group: getreplay-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Promote ${{ inputs.release-scope }} candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
    env:
      RELEASE_HOST: ${{ vars.PRODUCTION_RELEASE_HOST }}
      RELEASE_PORT: ${{ vars.PRODUCTION_RELEASE_PORT }}
      RELEASE_USER: ${{ vars.PRODUCTION_RELEASE_USER }}
      RELEASE_SCOPE: ${{ inputs.release-scope }}
      RELEASE_KEY: ${{ secrets.PRODUCTION_RELEASE_SSH_KEY }}
      RELEASE_KNOWN_HOSTS: ${{ secrets.PRODUCTION_RELEASE_KNOWN_HOSTS }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Validate fixed deployment target and scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RELEASE_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$RELEASE_PORT" =~ ^[0-9]{1,5}$ ]]
          (( RELEASE_PORT >= 1 && RELEASE_PORT <= 65535 ))
          [[ "$RELEASE_SCOPE" =~ ^(all|frontend|node|php|go|migrations)$ ]]
          [[ -n "$RELEASE_KEY" ]]
          [[ -n "$RELEASE_KNOWN_HOSTS" ]]

      - name: Install ephemeral SSH credentials
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/getreplay-release-ssh"
          printf '%s\n' "$RELEASE_KEY" > "$RUNNER_TEMP/getreplay-release-ssh/id"
          printf '%s\n' "$RELEASE_KNOWN_HOSTS" > "$RUNNER_TEMP/getreplay-release-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/getreplay-release-ssh/id"
          chmod 0644 "$RUNNER_TEMP/getreplay-release-ssh/known_hosts"

      - name: Select reviewed candidate scope from this commit
        shell: bash
        run: |
          set -euo pipefail

          fetch_reviewed_file() {
            local source_path="$1"
            local destination="$2"
            local api_url response encoded
            api_url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/$source_path?ref=$GITHUB_SHA"
            response="$(curl --fail --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$api_url")"
            encoded="$(jq -r '.content' <<<"$response" | tr -d '\n')"
            [[ "$encoded" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
            printf '%s' "$encoded" | base64 --decode > "$destination"
          }

          fetch_reviewed_file release/candidate.json "$RUNNER_TEMP/candidate.json"
          fetch_reviewed_file release/select_scope.py "$RUNNER_TEMP/select_scope.py"

          if [ "$RELEASE_SCOPE" = all ]; then
            release_id=candidate
          else
            release_id="candidate-$RELEASE_SCOPE"
          fi
          python3 "$RUNNER_TEMP/select_scope.py" \
            --scope "$RELEASE_SCOPE" \
            --release-id "$release_id" \
            --input "$RUNNER_TEMP/candidate.json" \
            --output "$RUNNER_TEMP/selected-candidate.json"
          python3 -m json.tool "$RUNNER_TEMP/selected-candidate.json" >/dev/null
          manifest="$(base64 < "$RUNNER_TEMP/selected-candidate.json" | tr -d '\n')"
          [[ "$manifest" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
          printf 'RELEASE_ID=%s\n' "$release_id" >> "$GITHUB_ENV"
          printf 'RELEASE_MANIFEST=%s\n' "$manifest" >> "$GITHUB_ENV"

      - name: Stage reviewed candidate
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -F /dev/null \
            -T \
            -o BatchMode=yes \
            -o ClearAllForwardings=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o RequestTTY=no \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/getreplay-release-ssh/known_hosts" \
            -i "$RUNNER_TEMP/getreplay-release-ssh/id" \
            -p "$RELEASE_PORT" \
            "$RELEASE_USER@$RELEASE_HOST" \
            "getreplay-release stage $RELEASE_ID $RELEASE_MANIFEST"

      - name: Preview immutable release
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -F /dev/null \
            -T \
            -o BatchMode=yes \
            -o ClearAllForwardings=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o RequestTTY=no \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/getreplay-release-ssh/known_hosts" \
            -i "$RUNNER_TEMP/getreplay-release-ssh/id" \
            -p "$RELEASE_PORT" \
            "$RELEASE_USER@$RELEASE_HOST" \
            "getreplay-release preview promote $RELEASE_ID"

      - name: Deploy production scope
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -F /dev/null \
            -T \
            -o BatchMode=yes \
            -o ClearAllForwardings=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o RequestTTY=no \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/getreplay-release-ssh/known_hosts" \
            -i "$RUNNER_TEMP/getreplay-release-ssh/id" \
            -p "$RELEASE_PORT" \
            "$RELEASE_USER@$RELEASE_HOST" \
            "getreplay-release promote $RELEASE_ID"
